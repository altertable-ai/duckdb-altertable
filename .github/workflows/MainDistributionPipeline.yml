#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Mock-backed integration tests
    runs-on: ubuntu-24.04
    services:
      altertable:
        image: ghcr.io/altertable-ai/altertable-mock@sha256:9f9df026fbd6c31dee9242309417d4fe4c7376cd19f9c68a3d3f1d28d5a03d1d
        ports:
          - 15002:15002
        env:
          ALTERTABLE_MOCK_USERS: testuser:testpass
        options: >-
          --health-cmd "exit 0"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
          --health-start-period 10s
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: ninja
      ALTERTABLE_TEST_HOST: localhost
      ALTERTABLE_TEST_PORT: 15002
      ALTERTABLE_TEST_USER: testuser
      ALTERTABLE_TEST_PASSWORD: testpass
      ALTERTABLE_TEST_SSL: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Build
        run: make

      - name: Wait for mock service
        run: |
          ready_checks=0
          for _ in {1..30}; do
            if (echo >/dev/tcp/127.0.0.1/15002) 2>/dev/null; then
              ready_checks=$((ready_checks + 1))
              if [[ "$ready_checks" -ge 5 ]]; then
                exit 0
              fi
            else
              ready_checks=0
            fi
            sleep 1
          done
          echo "altertable-mock did not accept connections on port 15002" >&2
          exit 1

      - name: Test
        run: make test

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: altertable
      # Arrow Flight pulls in Thrift; vcpkg's thrift port needs bison > 2.5 (brew on macOS, yum in Linux images).
      extra_toolchains: "parser_tools"
      # Extension relies on vcpkg deps that are not supported for WASM builds.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads"
      opt_in_archs: "linux_amd64_musl;linux_arm64_musl"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: altertable
      # clang-tidy needs vcpkg (Arrow); the reusable workflow does not set up vcpkg — see extension-tidy-check.
      format_checks: "format"

  extension-tidy-check:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      VCPKG_BINARY_SOURCES: "clear;http,https://vcpkg-cache.duckdb.org,read"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build clang-tidy && sudo pip3 install pybind11[global] --break-system-packages

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: clang-tidy
        run: make tidy-check
